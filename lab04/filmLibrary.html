<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Other meta tags -->
        <meta name="description" content="Film Library Application for Web Applications I course">
        <meta name="author" content="Stefano Tallone">

        <!-- CSS: Bootstrap, Bootstrap Icon, custom -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="style.css">

        <title>Film Library</title>
    </head>

    <body class="d-flex flex-column m-0">
        <header>
            <!-- NAVBAR-->
            <nav class="navbar bg-primary m-0">
                <div class="container-fluid align-items-center justify-content-between">
                    <!-- Bottone visibile solo su mobile -->
                    <button class="btn btn-primary d-md-none m-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
                        <i class="bi bi-filter"></i>
                    </button>

                    <div class="title d-flex align-items-center">
                        <i class="bi bi-collection-play mx-2"></i>
                        <a class="title navbar-brand">Film Library</a>
                    </div>

                    <form class="d-flex align-items-center col-md-5" role="search">
                        <input class="d-none d-md-flex form-control me-2" type="search" placeholder="Search" aria-label="Search">

                        <i class="bi bi-person-circle mx-2"></i>
                    </form>
                </div>
            </nav>
        </header>

        <div class="d-flex flex-row flex-grow-1">
            <aside class="col-4 bg-body-tertiary p-3 d-none d-md-block">
                <h2 class="m-3">Filters</h2>
                <div class="list-group">
                    <button type="button" class="list-group-item list-group-item-action active" aria-current="true">All</button>
                    <button type="button" class="list-group-item list-group-item-action">Favorites</button>
                    <button type="button" class="list-group-item list-group-item-action">Best Rated</button>
                    <button type="button" class="list-group-item list-group-item-action">Seen Last Month</button>
                    <button type="button" class="list-group-item list-group-item-action">Unseen</button>
                </div>

            </aside>

            <!-- Offcanvas (solo mobile) -->
            <div class="offcanvas offcanvas-start d-md-none" id="sidebar">
                <div class="offcanvas-header">
                    <h3 class="offcanvas-title">Filters</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <div class="list-group">
                        <button type="button" class="list-group-item list-group-item-action active" aria-current="true">All</button>
                        <button type="button" class="list-group-item list-group-item-action">Favorites</button>
                        <button type="button" class="list-group-item list-group-item-action">Best Rated</button>
                        <button type="button" class="list-group-item list-group-item-action">Seen Last Month</button>
                        <button type="button" class="list-group-item list-group-item-action">Unseen</button>
                    </div>
                </div>
            </div>

            <main class="col-md-8 p-3">
                <h1>All films</h1>

                <!-- Pulp Fiction -->
                <div class="film d-flex flex-wrap justify-content-between align-items-center">
                    <div class="title-film d-flex align-items-center col-md-2 col-12">
                        <a href="#"><i class="bi bi-suit-heart-fill mx-2"></i></a>
                        <p>Pulp Fiction</p>
                    </div>

                    <p>March 10, 2026</p>

                    <div class="rating-and-edit d-flex align-items-center">
                        <div class="rating me-4">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star"></i>
                        </div>

                        <div class="edit">
                            <a href="#"><i class="bi bi-pencil me-2"></i></a>
                            <a href="#"><i class="bi bi-trash me-2"></i></a>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- 21 Grams -->
                <div class="film d-flex flex-wrap justify-content-between align-items-center">
                    <div class="title-film d-flex align-items-center col-md-2 col-12">
                        <a href="#"><i class="bi bi-suit-heart mx-2"></i></a>
                        <p>21 Grams</p>
                    </div>

                    <p>March 17, 2026</p>

                    <div class="rating-and-edit d-flex align-items-center">
                        <div class="rating me-4">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                        </div>

                        <div class="edit">
                            <a href="#"><i class="bi bi-pencil me-2"></i></a>
                            <a href="#"><i class="bi bi-trash me-2"></i></a>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- Star Wars -->
                <div class="film d-flex flex-wrap justify-content-between align-items-center">
                    <div class="title-film d-flex align-items-center col-md-2 col-12">
                        <a href="#"><i class="bi bi-suit-heart mx-2"></i></a>
                        <p>Star Wars</p>
                    </div>

                    <p></p>

                    <div class="rating-and-edit d-flex align-items-center">
                        <div class="rating me-4">
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                        </div>

                        <div class="edit">
                            <a href="#"><i class="bi bi-pencil me-2"></i></a>
                            <a href="#"><i class="bi bi-trash me-2"></i></a>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- Matrix -->
                <div class="film d-flex flex-wrap justify-content-between align-items-center">
                    <div class="title-film d-flex align-items-center col-md-2 col-12">
                        <a href="#"><i class="bi bi-suit-heart mx-2"></i></a>
                        <p>Matrix</p>
                    </div>

                    <p></p>

                    <div class="rating-and-edit d-flex align-items-center">
                        <div class="rating me-4">
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                            <i class="bi bi-star"></i>
                        </div>

                        <div class="edit">
                            <a href="#"><i class="bi bi-pencil me-2"></i></a>
                            <a href="#"><i class="bi bi-trash me-2"></i></a>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- Shrek 2 -->
                <div class="film d-flex flex-wrap justify-content-between align-items-center">
                    <div class="title-film d-flex align-items-center col-md-2 col-12">
                        <a href="#"><i class="bi bi-suit-heart-fill mx-2"></i></a>
                        <p>Shrek 2</p>
                    </div>

                    <p>March 21, 2026</p>

                    <div class="rating-and-edit d-flex align-items-center">
                        <div class="rating me-4">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                        </div>

                        <div class="edit">
                            <a href="#"><i class="bi bi-pencil me-2"></i></a>
                            <a href="#"><i class="bi bi-trash me-2"></i></a>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
